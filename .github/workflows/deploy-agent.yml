name: Deploy Foundry Multi-Agent Solution

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install AZD
        run: |
          curl -fsSL https://aka.ms/install-azd.sh | bash

      - name: Install Azure AI Agents Extension
        run: |
          azd extension install azure.ai.agents

      - name: Configure AZD Authentication
        run: |
          azd config set auth.useAzCliAuth true

      - name: Show Installed Versions
        run: |
          az version
          azd version
          azd extension list

      - name: Set Up AZD Environment
        run: |
          azd env new Azure-AgenticAI-Multiagent || azd env select Azure-AgenticAI-Multiagent
          azd env set AZURE_SUBSCRIPTION_ID ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          azd env set AZURE_LOCATION eastus2

      - name: Show Environment Values
        run: |
          azd env get-values

      - name: Deploy Multi-Agent Solution
        run: |
          azd up --no-prompt