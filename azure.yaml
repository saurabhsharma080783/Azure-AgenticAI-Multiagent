# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
name: azure-agenticai-multiagent

services:

  ai-project:
    host: azure.ai.project

  orchestrator-agent:
    host: azure.ai.agent
    project: src/agents/orchestrator-agent
    language: python
    kind: hosted

  requirement-agent:
    host: azure.ai.agent
    project: src/agents/requirement-agent
    language: python
    kind: hosted

  prompt-agent:
    host: azure.ai.agent
    project: src/agents/prompt-agent
    language: python
    kind: hosted

  solution-agent:
    host: azure.ai.agent
    project: src/agents/solution-agent
    language: python
    kind: hosted

infra:
  provider: microsoft.foundry